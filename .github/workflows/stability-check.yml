name: Stability Check

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository hygiene guard
        shell: pwsh
        run: |
          $trackedPfx = git ls-files "*.pfx"
          if ($trackedPfx) {
            Write-Error "Signing certificate files must not be committed: $trackedPfx"
            exit 1
          }

      - name: Test telemetry timestamp freshness (no hardware)
        shell: pwsh
        run: |
          .\tests\Test-TelemetryFreshness.ps1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore OmenSuperHub.sln -NonInteractive

      - name: Build Release x64
        run: msbuild OmenSuperHub.sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:RestorePackages=false
