name: Apply Process Timeout Follow-up

on:
  push:
    branches:
      - process-timeout-20260929

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply follow-up
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('App/GpuAppManager.cs')
          text = p.read_text(encoding='utf-8')
          old = '''          try { process.Kill(); } catch { }
          try { process.WaitForExit(5000); } catch { }
          stopwatch.Stop();

          string timeoutMessage = $"Command timed out after {timeoutMilliseconds} ms: {command}";
          Logger.Warn(timeoutMessage);
          string capturedError;
          lock (error) capturedError = error.ToString();

          return new ProcessResult {
            ExitCode = -1,
            Output = output.ToString(),
'''
          new = '''          try { process.Kill(); } catch { }
          try {
            bool killedProcessExited = process.WaitForExit(5000);
            if (killedProcessExited) process.WaitForExit();
          } catch { }
          stopwatch.Stop();

          string timeoutMessage = $"Command timed out after {timeoutMilliseconds} ms: {command}";
          Logger.Warn(timeoutMessage);
          string capturedOutput;
          string capturedError;
          lock (output) capturedOutput = output.ToString();
          lock (error) capturedError = error.ToString();

          return new ProcessResult {
            ExitCode = -1,
            Output = capturedOutput,
'''
          if old not in text:
              raise SystemExit('Expected timeout block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/GpuAppManager.cs
          git commit -m "Drain timed-out process output safely"
          git push
