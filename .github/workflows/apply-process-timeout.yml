name: Apply Process Timeout Patch

on:
  push:
    branches:
      - process-timeout-20260929

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python tools/patch_process_timeout.py

      - name: Verify patch
        run: git diff --check && git diff -- App/GpuAppManager.cs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/GpuAppManager.cs
          git commit -m "Bound external command execution time"
          git push
