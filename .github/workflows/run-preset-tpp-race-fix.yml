name: Run Preset TPP Race Fix

on:
  push:
    branches:
      - audit-stability-20260918

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python tools/fix_preset_tpp_race.py

      - name: Verify patch
        run: git diff --check && git diff -- Program.Config.cs

      - name: Commit source and remove temporary patch machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Program.Config.cs
          git rm -f tools/fix_preset_tpp_race.py
          git rm -f .github/workflows/run-preset-tpp-race-fix.yml
          git commit -m "Cancel stale preset TPP writes"
          git push
